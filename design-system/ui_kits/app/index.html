<!-- @dsCard group="App" viewport="420x880" name="Quest companion app" subtitle="Trail chart, station check-in with seal reveal, collection and party" -->
<!doctype html><html><head><meta charset="utf-8"><title>Questland Adventures — app kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--stone-950);display:grid;place-items:center;min-height:100vh}
.phone{width:390px;height:844px;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-page);border:1px solid var(--border-strong);border-radius:34px;box-shadow:var(--shadow-lg)}
.statusbar{flex:0 0 auto;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font:700 12px/1 var(--font-ui);color:var(--parchment-100);background:var(--stone-950)}
.screen{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="TrailMap.jsx"></script>
<script type="text/babel" src="StationCheckIn.jsx"></script>
<script type="text/babel" src="Collection.jsx"></script>
<script type="text/babel" src="Party.jsx"></script>
<script type="text/babel">
const { TabBar, Dialog, Button, Seal } = window.QuestlandAdventuresDesignSystem_fd4a09;

function App(){
  const [tab,setTab]=React.useState('map');
  const [station,setStation]=React.useState(null);
  const [awarded,setAwarded]=React.useState(false);
  return (<div className="phone">
    <div className="statusbar"><span>9:41</span><span>Pinewilds · 4G</span></div>
    <div className="screen">
      {station!==null
        ? <window.StationCheckIn index={station} onBack={()=>setStation(null)} onSealed={()=>{setAwarded(true);setStation(null)}} />
        : tab==='map' ? <window.TrailMap onOpenStation={i=>setStation(i)} />
        : tab==='quests' ? <window.TrailMap onOpenStation={i=>setStation(i)} />
        : tab==='seals' ? <window.Collection />
        : <window.Party />}
      <Dialog open={awarded} ceremonial eyebrow="Seal earned" title="Riverkeeper"
        onClose={()=>setAwarded(false)} width={330}
        footer={<Button onClick={()=>setAwarded(false)}>Continue</Button>}>
        <div style={{display:'flex',gap:'var(--space-md)',alignItems:'center'}}>
          <Seal art="relief" size="sm" assetBase="../.." />
          <span>The word was <em>river</em>. Station four has unlocked — follow the gold markers north.</span>
        </div>
      </Dialog>
    </div>
    <TabBar value={tab} onChange={t=>{setStation(null);setTab(t)}} items={[
      {id:'map',label:'Chart',icon:'map'},
      {id:'quests',label:'Quests',icon:'route',badge:2},
      {id:'seals',label:'Seals',icon:'stamp'},
      {id:'party',label:'Party',icon:'users'}]} />
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
